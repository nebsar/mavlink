group = System.getenv('JITPACK') == 'true' ?
        "${rootProject.group}.${rootProject.name}" : rootProject.group

apply plugin: 'java'
apply from: rootProject.file('sonatype.gradle')

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation group: 'junit', name: 'junit', version: '4.12'
}
