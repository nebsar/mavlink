group 'io.dronefleet.mavlink'

apply plugin: 'java'
apply from: rootProject.file('sonatype.gradle')

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation group: 'junit', name: 'junit', version: '4.12'
}
