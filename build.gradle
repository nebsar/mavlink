group 'io.dronefleet.mavlink'
version '1.1.11'

apply plugin: 'java'
apply plugin: 'io.dronefleet.mavlink.generator'
apply from: rootProject.file('sonatype.gradle')

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenLocal()
    mavenCentral()
}

def genSrc = layout.buildDirectory.dir("generated/sources/mavlink/main/java")

generateDialect {
    definitions file('definition-xml')
    generatedSources genSrc.get().asFile
}

sourceSets.main.java.srcDir genSrc

dependencies {
    implementation project('mavlink-protocol')

    testImplementation group: 'junit', name: 'junit', version: '4.12'
}
